<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Agências</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Cabeçalho (Hero Section) -->
    <header class="bg-gradient-to-r from-blue-700 to-blue-500 text-white py-12 px-6 shadow-lg">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-4xl font-bold mb-4 tracking-tight">Consulta de Agências</h1>
            <p class="text-lg text-blue-100 max-w-2xl mx-auto">
                Pesquise rapidamente unidades por CGC, UF ou Município.
            </p>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-grow max-w-5xl mx-auto p-6 -mt-8 w-full z-10">
        
        <!-- Formulário de Pesquisa -->
        <div class="bg-white rounded-2xl shadow-md border border-slate-200 p-6 md:p-8 mb-8">
            <form id="searchForm" class="flex flex-col md:flex-row gap-4 items-end">
                <div class="w-full md:w-1/3">
                    <label for="filtro" class="block text-sm font-semibold text-slate-600 mb-2">Buscar por:</label>
                    <select id="filtro" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 transition-colors">
                        <option value="cgc">CGC</option>
                        <option value="uf">UF</option>
                        <option value="municipio">Município</option>
                    </select>
                </div>
                
                <div class="w-full md:w-2/3">
                    <label for="valor" class="block text-sm font-semibold text-slate-600 mb-2">Correspondência:</label>
                    <input type="text" id="valor" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 transition-colors" placeholder="Digite o termo para pesquisa..." required>
                </div>

                <div class="w-full md:w-auto">
                    <button type="submit" class="w-full md:w-auto text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-6 py-3 text-center transition-colors shadow-sm">
                        Pesquisar
                    </button>
                </div>
            </form>
        </div>

        <!-- Estado de Carregamento -->
        <div id="loading" class="hidden text-center py-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            <p class="text-slate-500 mt-2 font-medium">Buscando informações...</p>
        </div>

        <!-- Resultados -->
        <div id="resultsContainer" class="hidden">
            <h2 class="text-xl font-bold mb-4 text-slate-700 border-b pb-2">Resultados da Pesquisa</h2>
            
            <div id="resultsGrid" class="grid gap-5 md:grid-cols-2 lg:grid-cols-3">
                <!-- Os cards de agências serão injetados aqui via JavaScript -->
            </div>
            
            <!-- Mensagem caso não encontre resultados -->
            <div id="noResults" class="hidden bg-yellow-50 border border-yellow-200 text-yellow-700 px-5 py-4 rounded-lg text-center font-medium shadow-sm">
                Nenhuma agência encontrada para os parâmetros informados.
            </div>
        </div>

    </main>

    <!-- Rodapé -->
    <footer class="bg-slate-100 text-slate-500 py-6 text-center mt-auto border-t border-slate-200">
        <p class="text-sm font-medium">&copy; 2024 Gestão de Agências</p>
    </footer>

    <!-- Script de Busca Interativa -->
    <script src="home.js"></script>
</body>
</html>
